spring.application.name=agentic-ai-platform
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/agentic_ai_platform}
spring.datasource.username=${DATABASE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${DATABASE_PASSWORD:${MYSQL_PASSWORD:628056@Hk}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:false}
app.auth.jwt-secret=${JWT_SECRET_BASE64}
app.auth.access-token-minutes=15
app.auth.refresh-token-days=30
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
server.port=${SERVER_PORT:9095}
spring.servlet.multipart.max-file-size=${DOCUMENTS_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${DOCUMENTS_MAX_REQUEST_SIZE:105MB}
app.marketing.csv.max-file-bytes=${MARKETING_CSV_MAX_FILE_BYTES:5242880}
app.marketing.csv.max-rows=${MARKETING_CSV_MAX_ROWS:2000}
app.marketing.csv.max-total-contacts=${MARKETING_CSV_MAX_TOTAL_CONTACTS:2000}
app.ai.groq-api-key=${GROQ_API_KEY:}
app.ai.groq-model=${GROQ_MODEL:openai/gpt-oss-120b}
app.ai.groq-base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
app.marketing.mail.from=${SMTP_FROM:verified-sender@example.com}
app.marketing.mail.allowed-from=${SMTP_ALLOWED_FROM:verified-sender@example.com,outreach@example.com,admin@example.com}
app.marketing.mail.rate-limit.batch-size=${SMTP_BATCH_SIZE:25}
app.marketing.mail.rate-limit.pause-seconds=${SMTP_PAUSE_SECONDS:60}
app.seo.serpapi-key=${SERPAPI_API_KEY:}
app.seo.serpapi-engine=${SERPAPI_ENGINE:google}
app.seo.serpapi-gl=${SERPAPI_GL:us}
app.seo.serpapi-hl=${SERPAPI_HL:en}

# Inbound IMAP reply sync (GoDaddy Port 993 SSL)
app.mail.imap.host=${IMAP_HOST:${SMTP_HOST:}}
app.mail.imap.port=${IMAP_PORT:993}
app.mail.imap.username=${IMAP_USERNAME:${SMTP_USERNAME:}}
app.mail.imap.password=${IMAP_PASSWORD:${SMTP_PASSWORD:}}
app.mail.imap.ssl=true
app.mail.imap.folder=INBOX
app.mail.imap.enabled=true

# Marketing email engagement tracking base URL
app.marketing.tracking.base-url=${TRACKING_BASE_URL:http://localhost:9095}
